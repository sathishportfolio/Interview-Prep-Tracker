<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interview Prep Tracker</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script>
  // Applied synchronously, before first paint, so returning users don't see a theme flash while
  // app.js's module script (theme.js) loads and runs — see features/theme.js. Defaults to dark for
  // first-time visitors and any older saved schema that predates themeDark, but still respects an
  // explicit `false` (the user deliberately switched to light).
  try {
    var iqvSchema = JSON.parse(localStorage.getItem("iqv:v1"));
    var iqvThemeDark = iqvSchema && iqvSchema.globalToggles ? iqvSchema.globalToggles.themeDark : undefined;
    var iqvDark = iqvThemeDark === undefined ? true : !!iqvThemeDark;
  } catch (e) {
    var iqvDark = true;
  }
  document.documentElement.dataset.theme = iqvDark ? "dark" : "light";
  document.documentElement.setAttribute("data-bs-theme", iqvDark ? "dark" : "light");
</script>
</head>
<body>
<header id="appHeader" class="app-header">
  <div class="header-top">
    <h1 class="app-title"><i class="fa-solid fa-layer-group"></i> Interview Prep Tracker</h1>
    <div id="headerBreadcrumb" class="header-breadcrumb"></div>
    <div class="header-timer">
      <div class="sync-menu-wrap">
        <button id="syncMenuBtn" class="btn btn-outline-secondary btn-sm" title="Cloud Sync" aria-haspopup="true" aria-expanded="false">
          <i class="fa-solid fa-cloud"></i> Sync
          <span id="syncMenuStatusDot" class="sync-status-dot" hidden aria-hidden="true"></span>
          <span id="syncMenuStatusIndicator" class="sync-status-indicator" hidden aria-hidden="true"></span>
        </button>
        <div id="syncMenuPanel" class="sync-menu-panel" hidden>
          <div id="syncMenuSetupPrompt" class="sync-menu-setup">
            <p class="sync-menu-blurb">Sync your questions and progress across devices — edit on one, pick up on another.</p>
            <button id="syncMenuSetupBtn" type="button" class="btn btn-sm btn-primary">Set Up Cloud Sync</button>
          </div>
          <div id="syncMenuConnected" class="sync-menu-connected" hidden>
            <div class="sync-menu-status">
              <span id="lastSyncedLabel" class="last-synced-label"></span>
              <label class="sync-toggle-label" title="Pause/resume push-on-edit. Manual Push/Pull always work.">
                <input type="checkbox" id="syncEnabledToggle" class="sync-toggle-input" />
                <span class="sync-toggle-text">Auto-sync</span>
              </label>
            </div>
            <div class="sync-menu-status">
              <label class="sync-toggle-label" title="Block ALL pushing (Manual Push and auto-push) while keeping Pull fully working — for orgs that block/monitor pushes to GitHub Gist.">
                <input type="checkbox" id="pullOnlyToggle" class="sync-toggle-input" />
                <span class="sync-toggle-text">Pull Only</span>
              </label>
            </div>
            <div id="lastSyncedDetailLabel" class="last-synced-detail-label"></div>
            <div class="sync-menu-actions">
              <button id="manualPushBtn" type="button" class="btn btn-sm btn-outline-primary" title="Send your local changes to the cloud"><i class="fa-solid fa-cloud-arrow-up"></i> Push</button>
              <button id="manualPullBtn" type="button" class="btn btn-sm btn-outline-primary" title="Get the latest changes from the cloud"><i class="fa-solid fa-cloud-arrow-down"></i> Pull</button>
            </div>
            <button id="syncSettingsBtn" type="button" class="btn btn-sm btn-link sync-menu-manage">Manage cloud sync →</button>
          </div>
        </div>
      </div>
      <button id="themeToggleBtn" type="button" class="btn btn-sm btn-outline-secondary" title="Toggle Dark/Light Theme"><i class="fa-solid fa-moon"></i></button>
      <span id="timerDisplay" class="timer-display">00:00:00</span>
      <button id="timerStartBtn" class="btn btn-sm btn-success" title="Start"><i class="fa-solid fa-play"></i></button>
      <button id="timerPauseBtn" class="btn btn-sm btn-warning" title="Pause"><i class="fa-solid fa-pause"></i></button>
      <button id="timerResetBtn" class="btn btn-sm btn-secondary" title="Reset"><i class="fa-solid fa-rotate-left"></i></button>
    </div>
  </div>
</header>

<main class="app-main">

  <section id="toolbarCard" class="toolbar-card card">
    <div class="toolbar-row">
      <label class="btn btn-primary btn-sm">
        <i class="fa-solid fa-file-csv"></i> Upload CSV
        <input type="file" id="csvFileInput" accept=".csv" hidden>
      </label>
      <button id="loadSampleBtn" class="btn btn-outline-primary btn-sm"><i class="fa-solid fa-flask"></i> Load Sample</button>

      <select id="fileSwitcher" class="form-select form-select-sm file-switcher"></select>
      <button id="renameFileBtn" type="button" class="btn btn-outline-secondary btn-sm" title="Rename current file" hidden><i class="fa-solid fa-pen"></i></button>

      <div class="export-btn-wrap">
        <button id="exportMenuBtn" class="btn btn-outline-success btn-sm" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-file-export"></i> Export</button>
        <div id="exportMenuPanel" class="export-menu-panel" hidden>
          <button id="downloadProgressBtn" type="button" class="btn btn-sm btn-outline-secondary export-menu-item"><i class="fa-solid fa-download"></i> Download as CSV</button>
          <button id="copyProgressCsvBtn" type="button" class="btn btn-sm btn-outline-secondary export-menu-item"><i class="fa-solid fa-copy"></i> Copy as CSV</button>
        </div>
      </div>

      <button id="resetProgressBtn" class="btn btn-outline-warning btn-sm" title="Clear Done, Review Later, Visited, spaced-repetition scheduling, and Done History for the currently filtered questions (all questions if no filter is active) — keeps all questions, Starred, and other flags untouched"><i class="fa-solid fa-rotate-left"></i> Reset Progress</button>
      <button id="resetAllBtn" class="btn btn-outline-danger btn-sm" title="Wipe every file, all progress, and every setting — including Cross-Device Sync"><i class="fa-solid fa-trash"></i> Reset All</button>
      <button id="resetAllKeepSyncBtn" class="btn btn-outline-danger btn-sm" title="Wipe every file, all progress, and every setting — but keep the Cross-Device Sync connection so you don't have to reconnect it"><i class="fa-solid fa-trash-can"></i> Reset (Keep Sync)</button>
    </div>
    <div class="toolbar-row toolbar-row-secondary">
      <div class="temp-mode-wrap" title="Temp/Test Mode">
        <label class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="tempModeToggle" aria-label="Temp/Test Mode">
        </label>
      </div>
      <div class="auto-download-wrap" title="Auto-download the current file as CSV every minute">
        <label class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="autoDownloadToggle" aria-label="Auto Download Every Minute">
        </label>
      </div>
      <span id="footerLastSyncedDetail" class="footer-last-synced-detail"></span>
    </div>
  </section>

  <section id="filterCard" class="filter-card card">
    <button id="filterCardToggle" class="filter-card-toggle btn btn-sm btn-outline-secondary">
      <i class="fa-solid fa-filter"></i> Filters
    </button>
    <div id="filterCardBody" class="filter-card-body">
      <div class="filter-row">
        <div class="filter-field">
          <label>Subject</label>
          <div id="subjectFilterMount"></div>
        </div>
        <div class="filter-field">
          <label>Topic</label>
          <div id="topicFilterMount"></div>
        </div>
        <div class="filter-field">
          <label>SubTopic</label>
          <div id="subTopicFilterMount"></div>
        </div>
        <div class="filter-field">
          <label>Tags</label>
          <div class="tag-filter-row">
            <div id="tagFilterMount"></div>
            <button id="manageTagsBtn" type="button" class="btn btn-sm btn-outline-secondary tag-add-btn" title="Manage Tags — create, rename, delete, and link related tags">
              <i class="fa-solid fa-tags"></i>
            </button>
          </div>
        </div>
        <div class="filter-field status-filter-field">
          <label>Status</label>
          <div class="status-filter-row">
            <div id="statusFilterMount"></div>
            <div class="status-filter-icons-scroll">
              <button id="statusModeToggle" type="button" class="btn btn-sm btn-outline-secondary status-mode-toggle" title="Matching ANY selected status (OR) — click to require ALL instead (AND)">OR</button>
              <button id="clearStatusFilterBtn" type="button" class="btn btn-sm btn-outline-secondary status-clear-btn" title="Clear Status filter only">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
        </div>
        <button id="clearFiltersBtn" class="btn btn-sm btn-outline-secondary">Clear Filters</button>
      </div>
    </div>
  </section>

  <section id="statsRow" class="stats-row">
    <div id="globalStatsBadges" class="global-stats-badges"></div>
    <div id="globalActionsGroup" class="global-actions-group"></div>
    <div id="statsProgressBar" class="stats-progress-bar" hidden></div>
  </section>

  <section id="searchCard" class="search-card">
    <input type="text" id="jumpSearchInput" class="form-control form-control-sm" placeholder="Jump to Question…">
    <div id="jumpSearchResults" class="jump-search-results" hidden></div>
  </section>

  <div id="bulkAddRootWrap" class="bulk-add-root-wrap edit-gated"></div>

  <section id="bulkSelectionBar" class="select-count-bar" hidden>
    <span id="bulkSelectionCount"></span>
    <span>
      <button id="bulkSelectAllBtn" class="btn btn-sm btn-outline-secondary" title="Select everything in the currently active group(s); click again to clear it">Select All</button>
      <select id="bulkDifficultySelect" class="form-select form-select-sm bulk-difficulty-select" title="Set Difficulty on the current selection">
        <option value="">Set Difficulty…</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
        <option value="clear">Clear Difficulty</option>
      </select>
      <button id="bulkNotImportantBtn" class="btn btn-sm btn-outline-secondary" title="Mark the current selection Not Important">Mark Not Important</button>
      <button id="bulkMoveSelectedBtn" class="btn btn-sm btn-primary">Move Selected</button>
      <button id="bulkDeleteSelectedBtn" class="btn btn-sm btn-danger">Delete Selected</button>
      <button id="bulkClearSelectedBtn" class="btn btn-sm btn-light">Clear</button>
    </span>
  </section>

  <section id="treeRoot" class="tree-root" aria-live="polite"></section>
  <section id="flatRoot" class="flat-root" hidden></section>

  <div id="noDataMessage" class="no-data-message" hidden>
    No data loaded yet. Upload a CSV or click "Load Sample" to get started.
  </div>

</main>

<footer id="appFooter" class="app-footer">
</footer>

<div id="floatingToggleGroup" class="floating-toggle-group">
  <button id="floatingMainBtn" class="floating-main-btn btn btn-primary"><i class="fa-solid fa-ellipsis-vertical"></i></button>
  <div class="floating-toggle-items">
    <button id="closeAllBtn" class="btn btn-sm btn-light" title="Close All Accordions"><i class="fa-solid fa-compress"></i></button>
    <button id="undoBtn" class="btn btn-sm btn-light" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
    <button id="redoBtn" class="btn btn-sm btn-light" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
    <button id="editModeToggleBtn" class="btn btn-sm btn-light" title="Toggle Edit Mode"><i class="fa-solid fa-pencil"></i></button>
    <button id="keyboardShortcutsBtn" class="btn btn-sm btn-light" title="Keyboard Shortcuts"><i class="fa-solid fa-keyboard"></i></button>
  </div>
</div>

<div id="modalHost" class="modal-host"></div>
<div id="toastHost" class="toast-host" aria-live="assertive"></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
